name: Redraw profile

on:
  schedule:
    - cron: "17 7 * * *"        # every night (07:17 UTC)
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    branches: [main, master]
    paths:
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Fetch numbers and draw every SVG + README
        run: python scripts/build.py
        env:
          # Optional: add a PROFILE_TOKEN secret (classic token, read:user) to also count private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "Redraw profile"
          git push
